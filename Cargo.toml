[package]
name = "wmtext"
version = "0.2.0"
edition = "2024"
description = "Detector and sanitizer for observable watermark and steganography signals in text"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ignore = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-normalization = "0.1"

[profile.release]
lto = "thin"
strip = true
